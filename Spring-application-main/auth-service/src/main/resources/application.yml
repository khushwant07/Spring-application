server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: ecommerce
    password: ecommerce
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth_schema
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    schemas: auth_schema
    default-schema: auth_schema
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:dev-secret-must-be-at-least-32-bytes!!}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

admin:
  email: ${ADMIN_EMAIL:admin@ecommerce.local}
  password: ${ADMIN_INITIAL_PASSWORD:Admin123!}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
