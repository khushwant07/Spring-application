server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss;

    # Docker embedded DNS: re-resolve api-gateway on each request window so restarts
    # and slow gateway startup do not leave nginx stuck on a stale or unready address.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_gateway_upstream http://api-gateway:8080;
        proxy_pass $api_gateway_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
